<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wer bin ich?</title>
<style>
:root{--bg:#f6efe2;--panel:#fffaf0;--ink:#25201a;--muted:#6f6657;--line:#e0d4bd;--btn:#1d6b6b;--btn-ink:#fff;--warn:#f2b632;--ok:#2e9e62}
@media (prefers-color-scheme:dark){:root{--bg:#17201f;--panel:#213130;--ink:#f3eddf;--muted:#a9b3a8;--line:#35504d;--btn:#3fb0a6;--btn-ink:#0f1a19}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;padding:20px;max-width:760px;margin-inline:auto}
h1{font-size:2rem;margin:0 0 8px}h2{margin:0 0 10px}p{color:var(--muted);line-height:1.4}a{color:var(--btn)}
.card{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:11px;margin-bottom:8px}
button{font:inherit;border:0;border-radius:14px;padding:13px 16px;background:var(--btn);color:var(--btn-ink);cursor:pointer;width:100%;margin-bottom:8px}
button.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--panel);border:2px solid var(--line);color:var(--ink);border-radius:18px;padding:12px 6px;margin:0;text-align:center;width:auto}
.tile .em{font-size:2.6rem;display:block;line-height:1.1}
.tile small{display:block;color:var(--muted);margin-top:4px;word-break:break-word}
.tile.sel{border-color:var(--btn);background:color-mix(in srgb,var(--btn) 18%,var(--panel))}
.tile.star{border-color:var(--warn);grid-column:span 2}.tile.star .em{font-size:3.6rem}
.tile.me{border-style:dashed}
.char{font-size:1.15rem;margin-top:6px;color:var(--ink)}
.q{font-size:2.2rem;display:block}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.big{font-size:2rem;text-align:center;margin:8px 0}
.err{color:#e0334c}
.info{background:var(--warn);color:#2a2000;border-radius:12px;padding:10px 14px;margin-bottom:12px}
.ok{color:var(--ok)}
ol{margin:8px 0 0;padding-left:24px;line-height:1.9}.dn{text-decoration:line-through;opacity:.5}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
var AN = { '🐼': 'Panda', '🐨': 'Koala', '🦊': 'Fuchs', '🐯': 'Tiger', '🦁': 'Löwe', '🐸': 'Frosch', '🐵': 'Affe', '🐰': 'Hase', '🐶': 'Hund', '🐱': 'Katze', '🐷': 'Schwein', '🐮': 'Kuh', '🐧': 'Pinguin', '🐙': 'Krake', '🐢': 'Schildkröte', '🦉': 'Eule' };
var app = document.getElementById('app');
var params = new URLSearchParams(location.search), inDiscord = params.has('frame_id');
var room = params.get('room') || '', name = '', err = '', info = '', ws, S = null, end = 0, tick, infoT;
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
function connect() {
  err = 'Verbinde mit dem Server …'; draw();
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + (inDiscord ? '/.proxy' : '') + '/ws2');
  ws.onopen = function () { send({ t: 'join', room: room, name: name }); };
  ws.onerror = function () { if (!S) { err = 'Verbindung zum Server fehlgeschlagen. Warte eine Minute und versuche es nochmal.'; draw(); } };
  ws.onmessage = function (e) {
    var m = JSON.parse(e.data);
    if (m.err) { err = m.err; S = null; }
    else if (m.info) { info = m.info; clearTimeout(infoT); infoT = setTimeout(function () { info = ''; draw(); }, 3500); }
    else { S = m; err = ''; end = m.left == null ? 0 : Date.now() + m.left; }
    draw();
  };
  ws.onclose = function () {
    if (S) { err = 'Verbindung verloren. Seite neu laden.'; S = null; draw(); }
    else if (err.indexOf('Verbinde') === 0 || err.indexOf('Verbindung zum') === 0) { err = 'Der Server hat die Verbindung beendet. Lade die Seite neu und versuche es nochmal.'; draw(); }
  };
}
function $(id) { return document.getElementById(id); }
function tile(p, extra, cls) {
  return '<button class="tile ' + (cls || '') + '" ' + (extra || '') + '><span class="em">' + (p.animal || '❔') + '</span><b>' + esc(p.name) + '</b></button>';
}
function draw() {
  clearInterval(tick);
  var keep = $('tx') ? $('tx').value : null, hadFocus = $('tx') && document.activeElement === $('tx');
  if (!S) {
    app.innerHTML = '<h1>Wer bin ich?</h1><p>Jeder bekommt von einem Mitspieler einen Charakter und muss ihn mit Ja/Nein-Fragen im Voicechat erraten.</p><div class="card"><input id="nm" placeholder="Dein Name" maxlength="20" value="' + esc(name) + '"><input id="rm" placeholder="Raumcode (Freunde geben denselben ein)" value="' + esc(room) + '"><button id="go">Beitreten</button><p class="err">' + esc(err) + '</p></div>';
    $('go').onclick = function () {
      name = $('nm').value.trim(); room = $('rm').value.trim() || 'main';
      if (!name) { err = 'Bitte Namen eingeben.'; return draw(); }
      connect();
    };
    return;
  }
  var me = S.players.filter(function (p) { return p.id === S.you; })[0], host = S.you === S.host;
  var h = info ? '<div class="info">' + esc(info) + '</div>' : '';
  if (S.ph === 'lobby') {
    var taken = {}; S.players.forEach(function (p) { if (p.animal) taken[p.animal] = p.id; });
    h += '<h2>Raum „' + esc(room) + '“</h2><div class="grid">' + S.players.map(function (p) { return '<div class="tile ' + (p.id === S.you ? 'me' : '') + '"><span class="em">' + (p.animal || '❔') + '</span><b>' + esc(p.name) + '</b></div>'; }).join('') + '</div>' +
      '<div class="card"><p style="margin-top:0">Wähle dein Tier:</p><div class="grid">' + Object.keys(AN).map(function (a) {
        var t = taken[a] && taken[a] !== S.you;
        return '<button class="tile ' + (me.animal === a ? 'sel' : '') + '" data-a="' + a + '"' + (t ? ' disabled' : '') + '><span class="em">' + a + '</span><small>' + AN[a] + '</small></button>';
      }).join('') + '</div></div>' +
      (host ? '<button id="st"' + (S.players.length < 2 || S.players.some(function (p) { return !p.animal; }) ? ' disabled' : '') + '>Spiel starten</button><p>Mindestens 2 Spieler, alle brauchen ein Tier.</p>' : '<p>Warte, bis der Spielleiter startet.</p>');
  } else if (S.ph === 'pick') {
    h += '<h2>Wem gibst du einen Charakter?</h2><p>' + (me.picked ? 'Gewählt. Warte auf die anderen …' : 'Jeden Spieler kann nur einer wählen. Graue sind schon vergeben.') + '</p><div class="grid">' +
      S.players.filter(function (p) { return p.id !== S.you; }).map(function (p) {
        return '<button class="tile" data-p="' + p.id + '"' + (me.picked || p.taken ? ' disabled' : '') + '><span class="em">' + p.animal + '</span><b>' + esc(p.name) + '</b>' + (p.taken ? '<small>vergeben</small>' : '') + '</button>';
      }).join('') + '</div><p>Schon gewählt: ' + S.players.filter(function (p) { return p.picked; }).map(function (p) { return esc(p.animal + ' ' + p.name); }).join(', ') + '</p>';
  } else if (S.ph === 'write') {
    var tg = S.players.filter(function (p) { return p.id === S.myTarget; })[0];
    h += '<h2>Gib ' + esc(tg.name) + ' einen Charakter</h2><div class="card"><div class="row"><span>Zeit</span><b id="tm" style="font-size:2rem"></b></div></div><div class="card"><div class="big">' + tg.animal + ' ' + esc(tg.name) + '</div><input id="tx" maxlength="40" placeholder="z. B. Albert Einstein" value="' + esc(S.myText) + '"><button id="wr">' + (me.done ? 'Ändern' : 'Abschicken') + '</button><p style="margin:0" class="' + (me.done ? 'ok' : '') + '">' + (me.done ? '✓ Gespeichert. Du kannst bis zum Ende noch ändern.' : 'Ein bekannter Mensch oder eine Figur. ' + esc(tg.name) + ' darf es nicht sehen!') + '</p></div><p>Fertig: ' + S.players.filter(function (p) { return p.done; }).map(function (p) { return esc(p.animal + ' ' + p.name); }).join(', ') + '</p>';
  } else if (S.ph === 'play' || S.ph === 'done') {
    var done = S.ph === 'done';
    var sorted = S.players.slice().sort(function (a, b) { return (a.place || 99) - (b.place || 99); });
    var ord = (S.order || []).map(function (id) { return S.players.filter(function (p) { return p.id === id; })[0]; }).filter(Boolean);
    var myPos = ord.map(function (p) { return p.id; }).indexOf(S.you) + 1;
    var orderCard = ord.length ? '<div class="card"><b>Reihenfolge beim Fragen</b><p style="margin:4px 0 0">' + (myPos ? 'Du bist Nr. ' + myPos + '. ' : '') + (ord[0].id === S.you ? 'Du fängst an!' : esc(ord[0].name) + ' fängt an.') + '</p><ol>' + ord.map(function (p) { return '<li class="' + (p.guessed ? 'dn' : '') + '">' + p.animal + ' ' + esc(p.name) + (p.id === S.you ? ' (du)' : '') + '</li>'; }).join('') + '</ol></div>' : '';
    h += '<h2>' + (done ? 'Auflösung' : 'Wer bin ich?') + '</h2><p>' + (done ? 'Die Runde ist vorbei. Hier die Platzierung.' : me.guessed ? '✅ Du hast es gelöst (Platz ' + me.place + '). Die anderen raten noch.' : 'Stellt Ja/Nein-Fragen im Voicechat. Wenn du es weißt, tippe deinen Charakter ein und drücke Überprüfen. Falsch? Dann rate einfach weiter.') + '</p>' + (done ? '' : orderCard) + '<div class="grid">' + (done ? sorted : S.players).map(function (p) {
      var mine = p.id === S.you && !p.guessed && !done;
      return '<div class="tile ' + (p.id === S.you ? 'me' : '') + '"><span class="em">' + p.animal + '</span><b>' + esc(p.name) + (p.guessed ? ' ✅ #' + p.place : '') + '</b><div class="char">' + (mine ? '<span class="q">❓</span>' : esc(p.char || '')) + '</div>' + (!done && p.tries && !p.guessed ? '<small>Versuche: ' + p.tries + ' · zuletzt: ' + esc(p.wrong) + '</small>' : p.tries ? '<small>Versuche: ' + p.tries + '</small>' : '') + '</div>';
    }).join('') + '</div>' + (done || me.guessed ? '' : '<div class="card"><input id="tx" maxlength="60" placeholder="Wer bin ich?"><button id="gs">Überprüfen</button></div>');
  }
  if (host && S.ph === 'play') h += '<button class="alt" id="fn">Runde beenden und auflösen</button>';
  if (host && S.ph !== 'lobby') h += '<button class="alt" id="rs">' + (S.ph === 'play' || S.ph === 'done' ? 'Neue Runde' : 'Abbrechen und zurück zur Lobby') + '</button>';
  app.innerHTML = h;
  document.querySelectorAll('[data-a]').forEach(function (b) { b.onclick = function () { send({ t: 'avatar', animal: b.getAttribute('data-a') }); }; });
  document.querySelectorAll('[data-p]').forEach(function (b) { b.onclick = function () { send({ t: 'pick', target: b.getAttribute('data-p') }); }; });
  function on(id, f) { var e = $(id); if (e) e.onclick = f; }
  on('st', function () { send({ t: 'start' }); }); on('gs', function () { send({ t: 'guess', text: $('tx').value }); }); on('fn', function () { send({ t: 'finish' }); }); on('rs', function () { send({ t: 'reset' }); });
  on('wr', function () { send({ t: 'write', text: $('tx').value }); });
  if ($('tx')) { if (keep !== null) $('tx').value = keep; if (hadFocus) $('tx').focus(); $('tx').onkeydown = function (e) { if (e.key === 'Enter') send({ t: S.ph === 'play' ? 'guess' : 'write', text: $('tx').value }); }; }
  var tm = $('tm');
  if (tm && end) { var f = function () { tm.textContent = Math.max(0, Math.ceil((end - Date.now()) / 1000)) + ' s'; }; f(); tick = setInterval(f, 500); }
}
draw();
})();
</script>
</body>
</html>
