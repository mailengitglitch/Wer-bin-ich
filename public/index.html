<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Der Dümmste fliegt</title>
<style>
:root{--bg:#f6efe2;--panel:#fffaf0;--ink:#25201a;--muted:#6f6657;--line:#e0d4bd;--heart:#e0334c;--btn:#1d6b6b;--btn-ink:#fff;--warn:#f2b632}
@media (prefers-color-scheme:dark){:root{--bg:#17201f;--panel:#213130;--ink:#f3eddf;--muted:#a9b3a8;--line:#35504d;--btn:#3fb0a6;--btn-ink:#0f1a19}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;padding:20px;max-width:720px;margin-inline:auto}
h1{font-size:2rem;margin:0 0 8px}h2{margin:0 0 10px}p{color:var(--muted);line-height:1.4}
.card{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:20px;margin-bottom:12px}
.q{font-size:1.8rem;line-height:1.3}
.a{margin-top:12px;padding:10px 14px;border-radius:12px;background:var(--warn);color:#2a2000}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:11px;margin-bottom:8px}
button{font:inherit;border:0;border-radius:14px;padding:13px 16px;background:var(--btn);color:var(--btn-ink);cursor:pointer;width:100%;margin-bottom:8px}
button.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px 12px}
.chip.out{opacity:.4;text-decoration:line-through}.chip.off{border-style:dashed}
.hr{color:var(--heart)}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.big{font-size:2rem;text-align:center;margin:8px 0}
.err{color:var(--heart)}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
const DISCORD_CLIENT_ID = ''; // optional: Application-ID aus dem Discord Developer Portal
const $ = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const params = new URLSearchParams(location.search);
const inDiscord = params.has('frame_id');
let room = params.get('room') || '', ws, S = null, err = '', name = '', tick;

if (inDiscord && DISCORD_CLIENT_ID) {
  try {
    const { DiscordSDK } = await import('/.proxy/esm/@discord/embedded-app-sdk');
    const sdk = new DiscordSDK(DISCORD_CLIENT_ID); await sdk.ready(); room = sdk.instanceId;
  } catch (e) { err = 'Discord-SDK konnte nicht geladen werden.'; }
}
const send = o => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));
function connect() {
  err = 'Verbinde mit dem Server …'; draw();
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + (inDiscord ? '/.proxy' : '') + '/ws');
  ws.onopen = () => send({ t: 'join', room, name });
  ws.onmessage = e => { const m = JSON.parse(e.data); if (m.err) { err = m.err; S = null; } else { S = m; err = ''; } draw(); };
  ws.onerror = () => { if (!S) { err = 'Verbindung zum Server fehlgeschlagen. Warte eine Minute und versuche es nochmal.'; draw(); } };
  ws.onclose = () => {
    if (S) { err = 'Verbindung verloren. Seite neu laden.'; S = null; draw(); }
    else if (err.startsWith('Verbinde') || err.startsWith('Verbindung zum')) { err = 'Der Server hat die Verbindung beendet. Lade die Seite neu und versuche es nochmal.'; draw(); }
  };
}
const hearts = n => n > 0 ? '<span class="hr">' + '♥'.repeat(n) + '</span>' : '☠';
const chips = () => '<div class="chips">' + S.players.map(p => `<span class="chip${p.h ? '' : ' out'}${p.on ? '' : ' off'}">${esc(p.name)} ${p.id === S.host ? '🎤' : hearts(p.h)}</span>`).join('') + '</div>';
const askedCard = () => { const a = S.players.find(p => p.id === S.asked); return a ? `<div class="card"><p style="margin:0">Die Frage geht an</p><div class="big">${a.id === S.you ? 'Du! 🎯' : esc(a.name)}</div></div>` : ''; };
const btn = (id, label, cls = '') => `<button id="${id}" class="${cls}">${label}</button>`;
const on = (id, f) => { const e = document.getElementById(id); if (e) e.onclick = f; };
const act = (id, t, extra) => on(id, () => send({ t, ...extra }));

function draw() {
  clearInterval(tick);
  if (!S) {
    $.innerHTML = `<h1>Der Dümmste fliegt</h1><p>Alle starten mit 3 Herzen. Fragen, dann wählt ihr den Dümmsten. Bei 2 Übrigen entscheiden 10 Fragen. Ideal mit Kameras im Discord-Call.</p><div class="card"><input id="nm" placeholder="Dein Name" maxlength="20" value="${esc(name)}"><input id="rm" placeholder="Raumcode (Freunde geben denselben ein)" value="${esc(room)}"${inDiscord ? ' disabled' : ''}>${btn('go', 'Beitreten')}<p class="err">${esc(err)}</p></div><p><a href="werbinich.html" style="color:var(--btn)">Anderes Spiel: „Wer bin ich?“ →</a></p>`;
    on('go', () => {
      name = document.getElementById('nm').value.trim(); room = document.getElementById('rm').value.trim() || 'main';
      if (!name) { err = 'Bitte Namen eingeben.'; return draw(); }
      connect();
    });
    return;
  }
  const host = S.you === S.host, me = S.players.find(p => p.id === S.you);
  const others = S.players.filter(p => p.h > 0 && p.id !== S.you && p.id !== S.host);
  let h = '';
  if (S.ph === 'lobby') {
    h = `<h2>Warteraum „${esc(room)}“</h2>${chips()}<p>${host ? 'Du bist Moderator und spielst nicht mit. Starte, wenn mindestens 2 Mitspieler da sind.' : 'Warte, bis der Moderator startet.'}</p>${host ? btn('st', 'Spiel starten') : ''}`;
  } else if (S.ph === 'round') {
    h = `<h2>Fragerunde</h2>${chips()}${askedCard()}<div class="card"><div class="row"><span>Zeit</span><b id="tm" style="font-size:2rem"></b></div></div><div class="card"><div class="q">${esc(S.q)}</div>${S.a ? `<div class="a">${esc(S.a)}${host && !S.show ? ' (nur du siehst das)' : ''}</div>` : ''}</div>${host ? btn('rv', 'Antwort für alle zeigen', 'alt') + btn('nx', 'Nächste Frage') + btn('tv', 'Jetzt abstimmen', 'alt') : '<p>Nur wer dran ist, antwortet laut im Call. Der Moderator geht durch die Fragen.</p>'}`;
  } else if (S.ph === 'vote') {
    const waiting = S.players.filter(p => p.h > 0 && p.on && !p.voted && p.id !== S.host).map(p => esc(p.name)).join(', ');
    h = `<h2>Abstimmung</h2>${chips()}` + (!host && me.h > 0 ? (S.myVote ? `<div class="card"><p>Deine Stimme ist abgegeben. Es fehlen noch: ${waiting || 'niemand'}</p></div>` : '<div class="card"><p>Wer war gerade der Dümmste? Geheim.</p></div>' + others.map(p => `<button data-v="${p.id}">${esc(p.name)}</button>`).join('')) : '<p>' + (host ? 'Du moderierst und stimmst nicht ab.' : 'Du bist raus und schaust zu.') + '</p>');
  } else if (S.ph === 'result') {
    const r = S.res;
    h = `<h2>Ergebnis</h2><div class="card">${S.players.filter(p => r.counts[p.id] !== undefined).map(p => `<div class="row"><span>${esc(p.name)}</span><span>${r.counts[p.id]} Stimmen</span></div>`).join('')}</div><div class="card"><div class="big">${esc(r.loser)} verliert ein Herz</div><p style="text-align:center">${r.tie ? 'Gleichstand, der Zufall hat entschieden. ' : ''}${r.out ? 'Ausgeschieden: Der Dümmste fliegt!' : ''}</p></div>${chips()}${host ? btn('ct', 'Weiter') : ''}`;
  } else if (S.ph === 'finale') {
    const f = S.fin, pn = f.pl[f.turn].name;
    if (f.wait) {
      h = `<h2>Finale</h2><div class="card"><div class="big">${esc(f.pl[0].name)} ist fertig</div><p style="text-align:center">Als Nächstes: ${esc(f.pl[1].name)}</p></div>` + (host ? btn('ct', 'Nächster Spieler startet') : '<p>Warte auf den Moderator.</p>');
    } else {
      h = `<h2>Finale: ${esc(pn)} ist dran</h2><div class="card"><div class="row"><span>${f.len === 1 ? 'Stechen' : 'Frage ' + (f.n + 1) + ' von ' + f.len}</span>${host ? `<span>${esc(f.pl[0].name)} ${f.s[0]} | ${esc(f.pl[1].name)} ${f.s[1]}</span>` : ''}</div></div><div class="card"><div class="q">${S.q === null ? 'Du bist gleich dran. Bitte jetzt nicht zuhören (Ton aus)!' : esc(S.q)}</div>${S.a ? `<div class="a">${esc(S.a)} (nur du siehst das)</div>` : ''}</div>` +
        (host ? `<p>Hat ${esc(pn)} richtig geantwortet?</p>${btn('jr', 'Richtig')}${btn('jf', 'Falsch', 'alt')}` : '<p>Antwort laut im Call. Die Punkte kennt nur der Moderator.</p>');
    }
  } else if (S.ph === 'done') {
    h = host ? `<h2>Beide fertig</h2><div class="card"><div class="row"><span>${esc(S.fin.pl[0].name)}</span><b>${S.fin.s[0]}</b></div><div class="row"><span>${esc(S.fin.pl[1].name)}</span><b>${S.fin.s[1]}</b></div></div>${btn('rz', 'Ergebnis für alle auflösen')}` : '<h2>Finale vorbei</h2><div class="card"><div class="big">Der Moderator löst gleich auf …</div></div>';
  } else if (S.ph === 'tie') {
    h = `<h2>Gleichstand!</h2><div class="card"><div class="big">${S.fin.s[0]} : ${S.fin.s[1]}</div></div>` + (host ? btn('tb', 'Stechen: je 1 Frage') : '<p>Der Moderator startet das Stechen.</p>');
  } else if (S.ph === 'end') {
    h = `<h1>Gewonnen!</h1><div class="card"><div class="big">${esc(S.winner)}</div><p style="text-align:center">ist nicht der Dümmste.</p></div>${S.fin && S.fin.s ? '<p style="text-align:center">Endstand: ' + esc(S.fin.pl[0].name) + ' ' + S.fin.s[0] + ' : ' + S.fin.s[1] + ' ' + esc(S.fin.pl[1].name) + '</p>' : ''}${host ? btn('rs', 'Nochmal spielen') : ''}`;
  }
  $.innerHTML = h;
  act('st', 'start'); act('rv', 'reveal'); act('nx', 'next'); act('tv', 'toVote'); act('ct', 'cont'); act('rs', 'restart');
  act('rz', 'resolve'); act('tb', 'tiebreak'); on('jr', () => send({ t: 'judge', w: 1 })); on('jf', () => send({ t: 'judge', w: 0 }));
  document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => send({ t: 'vote', target: b.dataset.v }));
  const tm = document.getElementById('tm');
  if (tm && S.endsAt) { const f = () => tm.textContent = Math.max(0, Math.ceil((S.endsAt - Date.now()) / 1000)) + ' s'; f(); tick = setInterval(f, 500); }
}
draw();
</script>
</body>
</html>
